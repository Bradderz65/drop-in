name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Verify and build
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease
      - name: Upload reports and APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-verification
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/
            app/build/outputs/apk/

  test-server:
    name: PC test server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test-server.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-test-server.txt
      - name: Verify server
        run: |
          python -m compileall -q tools
          PYTHONPATH=tools python -m unittest discover -s tools -p 'test_*.py'
          python -m pip check
